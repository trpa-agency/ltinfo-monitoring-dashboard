# nginx for the preview stage: serves the production build at the same subpath
# GitHub Pages uses for a project site, so links, assets, and the base href
# behave as they will in production. dist/ is copied to
# /usr/share/nginx/html/ltinfo-monitoring-dashboard by the Dockerfile.
#
# This file is included inside the http block by the image's nginx.conf, so a
# map is allowed here.

# Pages are never cached, so a rebuild shows on the next load. Keyed on the
# response type rather than the URL, so it holds for /a/b served from
# /a/b/index.html (Astro build.format 'directory', the default) and from
# /a/b.html (build.format 'file'). An empty value adds no header.
map $sent_http_content_type $page_cache_control {
    default      "";
    ~^text/html  "no-cache, no-store, must-revalidate";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/plain;

    # The bare origin forwards to the subpath, with or without the trailing slash.
    location = / {
        return 302 /ltinfo-monitoring-dashboard/;
    }
    location = /ltinfo-monitoring-dashboard {
        return 302 /ltinfo-monitoring-dashboard/;
    }

    # Astro's content-hashed bundles: a new build means new names, so cache hard.
    location ^~ /ltinfo-monitoring-dashboard/_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /ltinfo-monitoring-dashboard/ {
        # Pretty URLs for either Astro output format:
        #   build.format 'directory' (the default): /a/b -> /a/b/index.html
        #   build.format 'file':                    /a/b -> /a/b.html
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control $page_cache_control;
    }

    # Nothing is served outside the subpath.
    location / {
        return 404;
    }
}
